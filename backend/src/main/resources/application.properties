spring.application.name=task-reflow

# Render は待ち受けポートを PORT で渡してくる．: の右はローカル用の既定値
server.port=${PORT:8080}

# 接続先は環境変数で上書きする．本番は Neon，未設定ならローカルの PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskreflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kei}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# always だと起動のたびに schema.sql の DROP TABLE が走り，データが毎回消える．
# 表はデプロイ前に一度だけ手で作る
spring.sql.init.mode=never
